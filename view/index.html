<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Visual Studio Code Design System</title>
	<link rel="stylesheet" href="/canvas.css">
	<link rel="stylesheet" href="/shell.css">
	<link rel="stylesheet" href="/book-navigation.css">
	<script type="module" src="/shell.mjs"></script>
</head>
<body class="design-reference explorer">
	<a class="skip" href="#reference" hidden>Skip to content</a>
	<header class="explorer-heading">
		<div>
			<p class="book-title">Visual Studio Code Design System</p>
			<div class="checkout-details">
				<p id="checkout" class="meta"></p>
				<button id="refresh" type="button" disabled>Refresh topic</button>
				<details id="checkout-picker">
					<summary>Change checkout</summary>
					<form id="checkout-form">
						<label for="checkout-choice">Local worktree</label>
						<select id="checkout-choice" name="checkout"></select>
						<label for="checkout-path" hidden>Checkout path</label>
						<input id="checkout-path" name="path" type="text" autocomplete="off" hidden>
						<button type="submit">Browse checkout</button>
						<p>Browse saved files without switching or pulling a Git branch.</p>
					</form>
				</details>
			</div>
			<p id="checkout-mode" class="meta" role="status"></p>
		</div>
	</header>
	<div class="explorer-layout">
		<div id="book-navigation" hidden></div>
		<div class="explorer-article">
			<main id="reference" tabindex="-1"><p role="status">Reading this checkout...</p></main>
		</div>
	</div>
</body>
</html>
