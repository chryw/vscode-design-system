<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Visual Studio Code Design System</title>
	<link rel="stylesheet" href="/canvas.css">
	<link rel="stylesheet" href="/shell.css">
	<link rel="stylesheet" href="/book-navigation.css">
	<script type="module" src="/shell.mjs"></script>
</head>
<body class="design-reference explorer">
	<a class="skip" href="#reference" hidden>Skip to content</a>
	<header class="explorer-heading">
		<div class="site-bar">
			<div class="site-navigation"></div>
			<p class="book-title" title="Visual Studio Code Design System"><span class="brand-product">VS Code </span>Design System</p>
			<div class="checkout-details">
				<nav class="page-history" aria-label="Page history">
					<button id="history-back" type="button" disabled>Back</button>
					<button id="history-forward" type="button" disabled>Forward</button>
				</nav>
				<div class="checkout-split" role="group" aria-label="Content version">
					<button id="refresh" class="chrome-button secondary" type="button" aria-label="Refresh" disabled><span class="chrome-icon codicon-refresh" aria-hidden="true"></span><span id="refresh-label">Refresh</span></button>
					<button id="checkout-toggle" class="chrome-button secondary" type="button" aria-label="Content version" aria-haspopup="dialog" aria-controls="checkout-picker" aria-expanded="false" popovertarget="checkout-picker" disabled><span class="chrome-icon codicon-chevron-down" aria-hidden="true"></span></button>
				</div>
			</div>
		</div>
		<p id="checkout-mode" class="meta" role="status"></p>
		<p id="checkout-status" class="sr-only" role="status"></p>
	</header>
	<section id="checkout-picker" class="chrome-popup checkout-popup" popover="auto" role="dialog" aria-labelledby="checkout-title">
		<h2 id="checkout-title">Content version</h2>
		<p id="checkout" class="meta">Loading content version…</p>
		<form id="checkout-form">
			<label for="checkout-choice">Content version</label>
			<div class="chrome-select"><select id="checkout-choice" name="checkout" aria-describedby="checkout-help checkout-location" autofocus></select><span class="chrome-icon codicon-chevron-down" aria-hidden="true"></span></div>
			<p id="checkout-location" class="document-path"></p>
			<label for="checkout-path" hidden>Branch name or GitHub branch URL</label>
			<input id="checkout-path" class="chrome-input" name="branch" type="text" maxlength="2048" autocomplete="off" spellcheck="false" aria-describedby="checkout-help" hidden>
			<p id="checkout-error" class="checkout-error" role="alert" hidden></p>
			<button class="chrome-button" type="submit">Browse version</button>
			<p id="checkout-help">Remote versions are fetched into a private cache. This session reads saved files, including uncommitted edits. Your worktree and branch stay unchanged.</p>
		</form>
	</section>
	<div class="explorer-layout">
		<div id="book-navigation" hidden></div>
		<div class="explorer-article">
			<main id="reference" tabindex="-1"><p role="status">Reading this checkout...</p></main>
		</div>
	</div>
</body>
</html>
