<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Visual Studio Code Design System</title>
	<link rel="stylesheet" href="/canvas.css">
	<link rel="stylesheet" href="/shell.css">
	<link rel="stylesheet" href="/book-navigation.css">
	<script type="module" src="/shell.mjs"></script>
</head>
<body class="design-reference explorer">
	<a class="skip" href="#reference" hidden>Skip to content</a>
	<header class="explorer-heading">
		<div>
			<p class="book-title">Visual Studio Code Design System</p>
			<div class="checkout-details">
				<nav class="page-history" aria-label="Page history">
					<button id="history-back" type="button" disabled>Back</button>
					<button id="history-forward" type="button" disabled>Forward</button>
				</nav>
				<details id="checkout-picker">
					<summary>Checkout: <span id="checkout">Loading…</span></summary>
					<form id="checkout-form">
						<label for="checkout-choice">Local worktree</label>
						<select id="checkout-choice" name="checkout" aria-describedby="checkout-help"></select>
						<p id="checkout-location" class="document-path"></p>
						<label for="checkout-path" hidden>Checkout path</label>
						<input id="checkout-path" name="path" type="text" autocomplete="off" hidden>
						<button type="submit">Browse checkout</button>
						<p id="checkout-help">Read saved content from this checkout. Reload checkout also rereads the topic list and examples. Neither action switches or pulls Git branches.</p>
					</form>
				</details>
				<button id="refresh" type="button" disabled>Reload checkout</button>
			</div>
			<p id="checkout-mode" class="meta" role="status"></p>
			<p id="checkout-status" class="sr-only" role="status"></p>
		</div>
	</header>
	<div class="explorer-layout">
		<div id="book-navigation" hidden></div>
		<div class="explorer-article">
			<main id="reference" tabindex="-1"><p role="status">Reading this checkout...</p></main>
		</div>
	</div>
</body>
</html>
